<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Timeout Warning</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      text-transform: uppercase;
    }
    
    body {
      background-color: #afd9e9; /* Your specified background color */
      color: #ffffff;            /* Your specified white text */
      font-family: 'Barlow Condensed', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: hidden;
      text-align: center;
    }

    /* Warning Text Container */
    .warning-box {
      max-width: 800px;
      animation: pulse 2s infinite ease-in-out;
    }
    
    .title {
      font-size: 5rem;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 20px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    
    .subtitle {
      font-size: 2.5rem;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    /* Subdued animation to draw attention without flashing harshly */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="warning-box">
    <h1 class="title">Still there?</h1>
    <p class="subtitle">Touch the screen to continue</p>
  </div>

</body>
</html>
